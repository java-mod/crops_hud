name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.ctx.outputs.IS_RELEASE }}
      version: ${{ steps.ver.outputs.VERSION }}
      counter: ${{ steps.ver.outputs.COUNTER }}
      tag: ${{ steps.ver.outputs.TAG }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build type
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "IS_RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: ver
        run: |
          BASE=$(grep '^mod_version_base=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          COUNTER=$(cat build_counter.txt | tr -d '[:space:]')

          if [[ "${{ steps.ctx.outputs.IS_RELEASE }}" == "true" ]]; then
            NEXT=$((COUNTER + 1))
            echo "VERSION=${BASE}.${COUNTER}" >> "$GITHUB_OUTPUT"
            echo "COUNTER=${NEXT}" >> "$GITHUB_OUTPUT"
            echo "TAG=v${BASE}.${COUNTER}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${BASE}.${COUNTER}-dev" >> "$GITHUB_OUTPUT"
            echo "COUNTER=${COUNTER}" >> "$GITHUB_OUTPUT"
            echo "TAG=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: 1.21.4
            yarn_mappings: 1.21.4+build.8
            loader_version: 0.16.10
            fabric_api_version: 0.118.0+1.21.4
            minecraft_dependency: "~1.21.4"
            loader_dependency: ">=0.16.10"
            bundle_fabric_api_modules: "true"
          - minecraft_version: 1.21.5
            yarn_mappings: 1.21.5+build.1
            loader_version: 0.16.14
            fabric_api_version: 0.119.9+1.21.5
            minecraft_dependency: "~1.21.5"
            loader_dependency: ">=0.16.10"
            bundle_fabric_api_modules: "true"
          - minecraft_version: 1.21.7
            yarn_mappings: 1.21.7+build.1
            loader_version: 0.16.14
            fabric_api_version: 0.128.0+1.21.7
            minecraft_dependency: "~1.21.7"
            loader_dependency: ">=0.16.10"
            bundle_fabric_api_modules: "true"
          - minecraft_version: 1.21.8
            yarn_mappings: 1.21.8+build.1
            loader_version: 0.16.14
            fabric_api_version: 0.128.0+1.21.7
            minecraft_dependency: "~1.21.8"
            loader_dependency: ">=0.16.10"
            bundle_fabric_api_modules: "true"
          - minecraft_version: 1.21.10
            yarn_mappings: 1.21.10+build.2
            loader_version: 0.17.2
            fabric_api_version: 0.138.4+1.21.10
            minecraft_dependency: "~1.21.10"
            loader_dependency: ">=0.17.2"
            bundle_fabric_api_modules: "true"
          - minecraft_version: 1.21.11
            yarn_mappings: 1.21.11+build.4
            loader_version: 0.18.1
            fabric_api_version: 0.141.1+1.21.11
            minecraft_dependency: "~1.21.11"
            loader_dependency: ">=0.18.1"
            bundle_fabric_api_modules: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build matrix artifact
        run: >-
          ./gradlew clean verifyBuildOutputs remapJar
          -Pskip_build_counter=true
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pyarn_mappings=${{ matrix.yarn_mappings }}
          -Ploader_version=${{ matrix.loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Pminecraft_dependency=${{ matrix.minecraft_dependency }}
          -Ploader_dependency=${{ matrix.loader_dependency }}
          -Pbundle_fabric_api_modules=${{ matrix.bundle_fabric_api_modules }}
          -Pmod_version_override=${{ needs.prepare.outputs.version }}

      - name: Upload release artifact
        if: needs.prepare.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crophud-${{ needs.prepare.outputs.version }}-mc${{ matrix.minecraft_version }}
          path: build/libs/crophud-${{ needs.prepare.outputs.version }}+mc${{ matrix.minecraft_version }}.jar
          if-no-files-found: error

      - name: Upload dev artifact
        if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crophud-dev-mc${{ matrix.minecraft_version }}
          path: build/libs/crophud-${{ needs.prepare.outputs.version }}+mc${{ matrix.minecraft_version }}.jar
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: crophud-${{ needs.prepare.outputs.version }}-mc*
          merge-multiple: true

      - name: Bump build counter and create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ needs.prepare.outputs.counter }}" > build_counter.txt
          git add build_counter.txt
          git commit -m "버전 ${{ needs.prepare.outputs.tag }} 빌드 카운터 업데이트 [skip ci]"
          git tag ${{ needs.prepare.outputs.tag }}
          git push origin main --follow-tags

      - name: Generate release notes (current tag)
        uses: orhun/git-cliff-action@v4
        id: cliff_release
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Generate full CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || \
            git commit -m "CHANGELOG.md ${{ needs.prepare.outputs.tag }} 업데이트 [skip ci]"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Crops HUD ${{ needs.prepare.outputs.tag }}"
          tag_name: ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.cliff_release.outputs.content }}
          files: release-artifacts/*.jar
