name: VirusTotal Scan

# Runs after build.yml's `release` job publishes a GitHub Release (draft defaults to
# false in softprops/action-gh-release, so creating it fires this `release: published`
# event). Scans every attached .jar with VirusTotal and appends the analysis link(s)
# to the release body — see https://github.com/crazy-max/ghaction-virustotal.

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to append the analysis link(s) to the release body
    steps:
      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            \.jar$
